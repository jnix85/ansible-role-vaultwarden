---
# SPDX-License-Identifier: MIT
- name: Create backup directory
  ansible.builtin.file:
    path: "{{ vaultwarden_backup_dir }}"
    state: directory
    owner: "{{ vaultwarden_data_dir_owner }}"
    group: "{{ vaultwarden_data_dir_group }}"
    mode: "0750"

- name: Deploy backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: /usr/local/bin/vaultwarden-backup.sh
    owner: root
    group: root
    mode: "0750"

- name: Install cron job for daily backups
  ansible.builtin.cron:
    name: "vaultwarden backup"
    user: root
    minute: "{{ vaultwarden_backup_minute }}"
    hour: "{{ vaultwarden_backup_hour }}"
    job: "/usr/local/bin/vaultwarden-backup.sh"
